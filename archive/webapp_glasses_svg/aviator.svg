<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="aviatorLensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowA" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadowA)">
    <!-- Left Temple -->
    <path d="M 20 50 C 5 50, 5 30, 15 20" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Temple -->
    <path d="M 380 50 C 395 50, 395 30, 385 20" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Teardrop Rim -->
    <path d="M 30 45 C 70 30, 160 30, 170 55 C 180 95, 140 130, 95 130 C 45 130, 20 95, 30 45 Z" fill="url(#aviatorLensGrad)" stroke="url(#goldGrad)" stroke-width="7"/>
    <!-- Right Teardrop Rim -->
    <path d="M 370 45 C 330 30, 240 30, 230 55 C 220 95, 260 130, 305 130 C 355 130, 380 95, 370 45 Z" fill="url(#aviatorLensGrad)" stroke="url(#goldGrad)" stroke-width="7"/>

    <!-- Double Brow Bar -->
    <path d="M 150 42 L 250 42" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 160 56 Q 200 50 240 56" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Reflections -->
    <path d="M 50 50 Q 110 40 140 70 Q 110 58 50 50 Z" fill="#FFFFFF" opacity="0.25"/>
    <path d="M 350 50 Q 290 40 260 70 Q 290 58 350 50 Z" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>
