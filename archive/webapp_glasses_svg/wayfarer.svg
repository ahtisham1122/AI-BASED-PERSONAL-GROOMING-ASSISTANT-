<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wayfarerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="wayLensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowW" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadowW)">
    <!-- Left Temple -->
    <path d="M 15 50 L 5 40 C 0 35, 5 20, 15 20" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    <!-- Right Temple -->
    <path d="M 385 50 L 395 40 C 400 35, 395 20, 385 20" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Lens Rim -->
    <path d="M 25 35 L 175 42 Q 170 115 110 120 Q 35 115 25 35 Z" fill="url(#wayLensGrad)" stroke="url(#wayfarerGrad)" stroke-width="14" stroke-linejoin="round"/>
    <!-- Right Lens Rim -->
    <path d="M 225 42 L 375 35 Q 365 115 290 120 Q 230 115 225 42 Z" fill="url(#wayLensGrad)" stroke="url(#wayfarerGrad)" stroke-width="14" stroke-linejoin="round"/>

    <!-- Keyhole Bridge -->
    <path d="M 170 42 C 185 38, 215 38, 230 42 L 225 65 Q 200 58 175 65 Z" fill="url(#wayfarerGrad)"/>

    <!-- Metallic Silver Pins -->
    <ellipse cx="38" cy="46" rx="4" ry="2" fill="#E2E8F0"/>
    <ellipse cx="362" cy="46" rx="4" ry="2" fill="#E2E8F0"/>

    <!-- Lens Glare -->
    <path d="M 45 48 L 130 52 L 80 100 Z" fill="#FFFFFF" opacity="0.2"/>
    <path d="M 270 52 L 355 48 L 305 100 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>
</svg>
